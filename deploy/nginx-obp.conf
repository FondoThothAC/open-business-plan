# ═══════════════════════════════════════════════════════
#  OPCIÓN B: Server block independiente (si no existe uno)
#  Usar SOLO si fondothoth.com NO tiene un server block
# ═══════════════════════════════════════════════════════

server {
    listen 80;
    server_name fondothoth.com www.fondothoth.com;

    # Redirigir todo HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fondothoth.com www.fondothoth.com;

    # ─── SSL (Let's Encrypt / Certbot) ───
    # Estos paths se generan automáticamente con:
    #   sudo certbot --nginx -d fondothoth.com -d www.fondothoth.com
    ssl_certificate /etc/letsencrypt/live/fondothoth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fondothoth.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Sitio web principal (fondothoth.com) ───
    root /var/www/fondothoth;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Open Business Plan — Frontend (/obp) ───
    location /obp/ {
        alias /opt/obp/dist/;
        try_files $uri $uri/ /obp/index.html;

        # Cache inmutable para assets con hash de Vite
        location ~* /obp/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Open Business Plan — API Backend (/obp/api) ───
    location /obp/api/ {
        rewrite ^/obp/api/(.*)$ /api/$1 break;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE: desactivar buffering para streaming en tiempo real
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ─── Seguridad: headers de protección ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limitar tamaño de upload (para documentos PDF, Word, etc.)
    client_max_body_size 50M;
}
