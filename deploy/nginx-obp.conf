# ─────────────────────────────────────────────────────────
#  Nginx — Bloque de configuración para OBP con Anti-IA & Rate Limiting
#  Archivo: /etc/nginx/sites-available/fondothoth-obp
#
#  Incluye:
#    1. Zonas de Rate Limiting (Protección contra fuerza bruta y DoS)
#    2. Bloqueo de Bots y Crawlers de IA mediante User-Agent
#    3. Headers de seguridad HTTP (Anti-Clickjacking, Anti-MIME sniffing)
#    4. Proxy inverso a Express (Node.js) con soporte SSE sin buffer
#    5. Manejo SPA en /obp/ con fallback a index.html
# ─────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════
#  ZONAS DE CONTROL DE TASA Y MAPA ANTI-BOTS (Definir en http {})
# ═══════════════════════════════════════════════════════

# Mapa para bloquear agentes de IA y scrapers conocidos (403 Forbidden)
map $http_user_agent $is_ai_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|ClaudeBot|Claude-Web|Anthropic-AI) 1;
    ~*(CCBot|Bytespider|PerplexityBot|Amazonbot|Applebot-Extended) 1;
    ~*(Google-Extended|FacebookBot|Meta-ExternalAgent) 1;
    ~*(cohere-ai|Omgilibot|Diffbot|Scrapy|curl|wget|python-requests) 1;
}

# Zonas de Rate Limiting por IP
# - Zona para API general: 30 peticiones por segundo por IP
limit_req_zone $binary_remote_addr zone=obp_api_limit:10m rate=30r/s;
# - Zona estricta para Login y Registro: 5 peticiones por minuto por IP
limit_req_zone $binary_remote_addr zone=obp_auth_limit:10m rate=5r/m;

# ═══════════════════════════════════════════════════════
#  CONFIGURACIÓN DEL SERVIDOR VIRTUAL (fondothoth.com)
# ═══════════════════════════════════════════════════════

server {
    listen 80;
    server_name fondothoth.com www.fondothoth.com;

    # Redirigir todo HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fondothoth.com www.fondothoth.com;

    # ─── SSL (Let's Encrypt / Certbot) ───
    ssl_certificate /etc/letsencrypt/live/fondothoth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fondothoth.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Bloqueo Activo Anti-IA / Anti-Scraping ───
    if ($is_ai_bot) {
        return 403 "Acceso denegado: Crawlers y agentes automatizados de IA no permitidos.";
    }

    # ─── Sitio web principal (fondothoth.com) ───
    root /var/www/fondothoth;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Open Business Plan — Frontend (/obp) ───
    location /obp/ {
        alias /opt/obp/dist/;
        try_files $uri $uri/ /obp/index.html;

        # Cache inmutable para assets con hash de Vite
        location ~* /obp/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Open Business Plan — API de Auth con Rate Limit Estricto ───
    location ~ ^/obp/api/auth/(login|register) {
        limit_req zone=obp_auth_limit burst=3 nodelay;
        limit_req_status 429;

        rewrite ^/obp/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Open Business Plan — API Backend General (/obp/api) ───
    location /obp/api/ {
        limit_req zone=obp_api_limit burst=20 nodelay;
        limit_req_status 429;

        rewrite ^/obp/api/(.*)$ /api/$1 break;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE: desactivar buffering para streaming en tiempo real
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ─── Seguridad: headers de protección ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limitar tamaño de upload (para documentos PDF, Word, etc.)
    client_max_body_size 50M;
}
