# ─────────────────────────────────────────────────────────
#  Nginx — Bloque de configuración para OBP
#  Archivo: /etc/nginx/sites-available/fondothoth-obp
#
#  Este bloque se INCLUYE dentro del server {} existente
#  de fondothoth.com, o se agrega como archivo separado.
#
#  Instrucciones:
#    1. Copiar este archivo al VPS
#    2. sudo cp deploy/nginx-obp.conf /etc/nginx/sites-available/fondothoth-obp
#    3. Agregar las directivas location dentro del server block existente
#    4. sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════
#  OPCIÓN A: Incluir dentro del server block existente
#  Agregar estas líneas dentro de:
#    /etc/nginx/sites-available/fondothoth (o similar)
# ═══════════════════════════════════════════════════════

